<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 MUSIK 4.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- 🔥 FIREBASE CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-primary: #0A0A0C; --bg-secondary: #121216; --bg-card: #1A1A20;
            --bg-hover: #25252D; --text-primary: #F5F5F7; --text-secondary: #A1A1AA;
            --accent: #8B5CF6; --accent-hover: #7C3AED; --success: #10B981;
            --error: #EF4444; --warning: #F59E0B; --border: #27272A; --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg-primary: #F8FAFC; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
            --bg-hover: #F1F5F9; --text-primary: #0F172A; --text-secondary: #64748B;
            --accent: #7C3AED; --accent-hover: #6D28D9; --border: #E2E8F0; 
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-primary); color: var(--text-primary); 
            font-family: 'Inter', sans-serif; line-height: 1.5; 
            -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease; 
        }
        
        .app-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-header { flex-shrink: 0; margin-bottom: 1.5rem; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .app-header h1 { 
            font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; 
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            display: flex; align-items: center; gap: 1rem;
        }
        
        .version-badge { 
            font-size: 0.9rem; background: var(--accent); color: white; 
            padding: 4px 10px; border-radius: 20px; vertical-align: middle; 
            -webkit-text-fill-color: white; cursor: pointer; 
            transition: transform 0.2s, background 0.2s;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .version-badge:hover { transform: scale(1.05); background: var(--accent-hover); }

        .add-form { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .add-form input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 0.7rem 1rem; border-radius: var(--radius); font-size: 0.95rem; transition: var(--transition); }
        .add-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        
        .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
        .search-box { display: flex; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 1rem; flex: 1; min-width: 200px; }
        .search-box input { background: transparent; border: none; color: var(--text-primary); padding: 0.5rem; width: 100%; outline: none; }
        
        select, .btn-secondary, .btn-primary { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 0.5rem 0.9rem; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; transition: var(--transition); font-family: inherit; }
        select:hover, .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-cloud {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 0.9rem;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            opacity: 0.4;
        }
        .btn-cloud:hover { opacity: 0.6; background: var(--bg-hover); }
        .btn-cloud.active {
            opacity: 1;
            background: #FFA000;
            border-color: #FFA000;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 160, 0, 0.4);
        }
        .btn-cloud.active:hover { background: #FF8F00; }
        .btn-cloud .cloud-icon { font-size: 1.1rem; }
        .btn-cloud.loading { animation: pulse 1.5s infinite; }
        
        .stickers-bar { 
            display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; 
            padding: 0.6rem; background: var(--bg-secondary); 
            border: 1px solid var(--border); border-radius: var(--radius);
        }
        .stickers-label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-right: 0.5rem; }
        
        .sticker-filter {
            background: var(--bg-card); border: 2px solid var(--border); border-radius: 20px;
            padding: 0.35rem 0.7rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; font-weight: 600;
            color: var(--text-secondary); position: relative;
        }
        .sticker-filter:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
        .sticker-filter.active { background: var(--accent); border-color: var(--accent); color: white; }
        .sticker-filter.excluded { 
            background: var(--bg-card); border-color: var(--error); color: var(--error);
            text-decoration: line-through; opacity: 0.7;
        }
        .sticker-filter.excluded:hover { background: var(--bg-hover); opacity: 1; }
        .sticker-filter .sticker-icon { font-size: 0.95rem; }
        
        .sub-menu {
            position: absolute; top: calc(100% + 8px);
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0.5rem;
            display: flex; gap: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 100; min-width: max-content;
            left: 50%; transform: translateX(-50%);
        }
        .sub-menu.align-left { left: 0; transform: none; }
        .sub-menu.align-right { left: auto; right: 0; transform: none; }
        
        .sub-menu-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.25rem; padding: 0.4rem 0.6rem; border-radius: 8px;
            cursor: pointer; transition: var(--transition);
            font-size: 0.75rem; color: var(--text-secondary);
            border: 2px solid transparent; position: relative;
        }
        .sub-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sub-menu-item.active { background: var(--accent); color: white; border-color: var(--accent-hover); }
        .sub-menu-item.excluded { 
            border-color: var(--error); color: var(--error);
            text-decoration: line-through; opacity: 0.7;
        }
        .sub-menu-item.excluded::after {
            content: '✕'; position: absolute; top: -5px; right: -5px;
            background: var(--error); color: white; border-radius: 50%;
            width: 16px; height: 16px; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .sub-menu-item .sub-icon { font-size: 1.2rem; }

        .main-content {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 1.5rem; flex: 1; min-height: 0;
        }

        .column { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

        .column-header {
            flex-shrink: 0; padding: 1rem;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 0.75rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 0.75rem;
        }

        .column-header h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; margin: 0; }
        .count { color: var(--text-secondary); font-weight: normal; font-size: 1rem; }

        .btn-play-library {
            background: var(--success); color: white; border: none;
            padding: 0.6rem 1.5rem; border-radius: 30px; font-weight: bold;
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-play-library:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
        .btn-play-library:active { transform: scale(0.98); }
        .btn-play-library .play-icon { font-size: 1.2rem; }

        .btn-random {
            background: var(--bg-card); color: var(--text-secondary);
            border: 2px solid var(--border); padding: 0.6rem 1rem;
            border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
            transition: var(--transition); font-family: 'Inter', sans-serif;
        }
        .btn-random:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent); }
        .btn-random.active { background: var(--warning); color: white; border-color: var(--warning); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .btn-random.active:hover { background: #D97706; }
        .btn-random .random-icon { font-size: 1.1rem; }

        .column-content { flex: 1; overflow-y: auto; padding-right: 0.5rem; }
        .column-content::-webkit-scrollbar { width: 8px; }
        .column-content::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 4px; }
        .column-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .column-content::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .playlist-section {
            background: var(--bg-secondary); border: 2px solid var(--accent);
            border-radius: var(--radius); padding: 1rem;
            display: flex; flex-direction: column; height: 100%;
        }

        .playlist-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; align-items: center; }

        .playlist-input {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); padding: 0.4rem 0.8rem;
            border-radius: var(--radius); font-size: 0.85rem;
            flex: 1; min-width: 120px;
        }
        .playlist-input:focus { outline: none; border-color: var(--accent); }

        .btn-play-playlist { 
            background: var(--success); color: white; border: none; 
            padding: 0.5rem 1rem; border-radius: 30px; font-weight: bold; 
            font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: transform 0.2s;
        }
        .btn-play-playlist:hover { transform: scale(1.05); background: #059669; }
        
        .btn-icon-small {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-secondary); padding: 0.4rem 0.6rem;
            border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            transition: var(--transition); display: flex; align-items: center; gap: 0.3rem;
        }
        .btn-icon-small:hover { background: var(--bg-hover); color: var(--text-primary); }

        .playlist-items-container { flex: 1; overflow-y: auto; margin-top: 0.75rem; padding-right: 0.3rem; }
        .playlist-items-container::-webkit-scrollbar { width: 6px; }
        .playlist-items-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .playlist-item {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.6rem 0.8rem;
            display: flex; align-items: center; gap: 0.75rem;
            transition: var(--transition); cursor: move; margin-bottom: 0.4rem;
        }
        .playlist-item:hover { background: var(--bg-hover); border-color: var(--accent); }
        .playlist-item.dragging { opacity: 0.5; border-color: var(--accent); }
        
        .playlist-item-number {
            background: var(--accent); color: white;
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: bold; flex-shrink: 0;
        }
        
        .playlist-item-info { flex: 1; min-width: 0; }
        .playlist-item-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-item-artist { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .playlist-empty { text-align: center; color: var(--text-secondary); padding: 2rem 1rem; font-style: italic; font-size: 0.9rem; }

        .saved-playlists { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
        .saved-playlists-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }

        .saved-playlist-item {
            background: var(--bg-card); padding: 0.5rem 0.7rem;
            border-radius: 8px; display: flex;
            justify-content: space-between; align-items: center;
            gap: 0.5rem; margin-bottom: 0.4rem; border: 1px solid var(--border);
        }

        .saved-playlist-info { flex: 1; min-width: 0; }
        .saved-playlist-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .saved-playlist-count { font-size: 0.75rem; color: var(--text-secondary); }
        .saved-playlist-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
        
        .track-list { display: flex; flex-direction: column; gap: 0.5rem; }
        
        .track-card { 
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); 
            padding: 0.9rem; display: flex; justify-content: space-between; align-items: center; 
            transition: var(--transition); box-shadow: var(--card-shadow);
        }
        .track-card:hover { background: var(--bg-hover); border-color: var(--accent); transform: translateY(-1px); }
        
        .track-title { 
            font-size: 0.95rem; font-weight: 600; margin-bottom: 0.3rem; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
            cursor: pointer; transition: background 0.2s; padding: 2px 4px; border-radius: 4px;
        }
        .track-title:hover { background: rgba(139, 92, 246, 0.1); }
        
        .edit-input {
            width: 100%; background: var(--bg-primary);
            border: 2px solid var(--accent); color: var(--text-primary);
            padding: 4px 8px; border-radius: 6px;
            font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none;
        }
        .edit-input:focus { border-color: var(--accent-hover); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        .edit-hint { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; font-style: italic; }

        .track-stickers { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
        .sticker-tag { 
            background: var(--accent); color: white; padding: 1px 6px; border-radius: 10px; 
            font-size: 0.7rem; font-weight: 600; display: inline-flex; align-items: center; gap: 3px;
        }
        .sticker-tag.favori-tag { background: #FBBF24; color: #78350F; }
        
        .track-actions { display: flex; gap: 0.3rem; opacity: 0.7; transition: var(--transition); flex-shrink: 0; }
        .track-card:hover .track-actions { opacity: 1; }
        
        .btn-icon { background: transparent; border: none; color: var(--text-secondary); padding: 0.4rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: var(--transition); font-size: 1.1rem; }
        .btn-icon:hover { background: rgba(139, 92, 246, 0.1); color: var(--accent); }
        .btn-play:hover { color: var(--success) !important; } 
        .btn-delete:hover { color: var(--error) !important; }
        .btn-add-playlist:hover { color: var(--accent) !important; }
        
        .btn-fav { font-size: 1.3rem; }
        .btn-fav.active-fav { color: #FBBF24 !important; }
        .btn-fav:not(.active-fav) { color: var(--border) !important; }
        .btn-fav:not(.active-fav):hover { color: #FBBF24 !important; }
        
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.8rem 1.2rem; border-radius: var(--radius); display: flex; align-items: center; gap: 0.6rem; font-weight: 500; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); animation: slideIn 0.3s ease-out forwards; z-index: 1000; font-size: 0.9rem; }
        .toast-success { background: #064E3B; color: #A7F3D0; border: 1px solid #10B981; }
        .toast-error { background: #7F1D1D; color: #FCA5A5; border: 1px solid #EF4444; }
        .toast-warning { background: #78350F; color: #FDE68A; border: 1px solid #F59E0B; }
        .toast-info { background: #1E3A8A; color: #BFDBFE; border: 1px solid #3B82F6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem 0; font-size: 1rem; }
        
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            display: flex; align-items: center; justify-content: center; 
            z-index: 1000; backdrop-filter: blur(8px); animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content { 
            background: var(--bg-card); border: 1px solid var(--border); 
            border-radius: 16px; padding: 0; max-width: 560px; width: 90%; 
            max-height: 80vh; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out; display: flex; flex-direction: column;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-hover) 100%);
        }
        .modal-header h3 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        
        .modal-close-btn { 
            background: transparent; border: none; color: var(--text-secondary); 
            cursor: pointer; font-size: 1.2rem; width: 32px; height: 32px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .modal-close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        .timeline { position: relative; padding-left: 1.5rem; }
        .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
        .timeline-item { position: relative; margin-bottom: 1.5rem; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: -1.5rem; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-card); box-shadow: 0 0 0 2px var(--accent); }
        .timeline-item.current .timeline-dot { background: var(--success); box-shadow: 0 0 0 2px var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--success); } 50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.2); } }
        .timeline-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .version-tag { background: var(--accent); color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; }
        .timeline-item.current .version-tag { background: var(--success); }
        .version-date { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; }
        .timeline-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
        .feature-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
        .feature-item { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }
        .feature-icon { color: var(--success); font-size: 0.75rem; flex-shrink: 0; margin-top: 2px; }

        .sticker-box { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .sticker-item {
            background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 20px;
            padding: 0.3rem 0.6rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 600;
            color: var(--text-secondary); position: relative;
        }
        .sticker-item:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
        .sticker-item.active { background: var(--accent); border-color: var(--accent); color: white; }
        .sticker-item.favori-active { background: #FBBF24; border-color: #FBBF24; color: #78350F; }
        .sticker-item .sticker-icon { font-size: 0.9rem; }
        
        .btn-toggle-stickers { 
            background: transparent; border: none; color: var(--accent); 
            cursor: pointer; font-size: 0.8rem; margin-top: 0.3rem;
            text-decoration: underline; padding: 0;
        }
        .btn-toggle-stickers:hover { color: var(--accent-hover); }

                case 'SET_STICKER_FILTER': return { ...state, stickerFilter: action.payload };

                case 'SET_PLAYLISTS': return { ...state, playlists: action.payload };
                case 'SET_CURRENT_PLAYLIST': return { ...state, currentPlaylist: action.payload };

            const [isEditing, setIsEditing] = useState(false);
            const [editValue, setEditValue] = useState(value);
            const inputRef = useRef(null);

            useEffect(() => { setEditValue(value); }, [value]);
            useEffect(() => {
                if (isEditing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); }
            }, [isEditing]);

            const handleSave = () => {
                const trimmed = editValue.trim();
                if (trimmed && trimmed !== value) onSave(trimmed);
                setIsEditing(false);
            };
            const handleCancel = () => { setEditValue(value); setIsEditing(false); };
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleSave();
                else if (e.key === 'Escape') handleCancel();
            };

            if (isEditing) {
                return (

        function StickerFilterItem({ sticker, activeFilters, onToggle, onSubSelect, onGenreSelect, onLangueSelect, onTimeSelect, onSpeedSelect }) {
            const [showSubMenu, setShowSubMenu] = useState(false);
            const [menuPosition, setMenuPosition] = useState('center');
            const containerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (containerRef.current && !containerRef.current.contains(event.target)) setShowSubMenu(false);
                };
                if (showSubMenu) document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [showSubMenu]);

            useEffect(() => {
                if (showSubMenu && containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const menuWidth = 250;
                    const margin = 10;
                    if (rect.left < menuWidth / 2 + margin) setMenuPosition('left');
                    else if (rect.right > window.innerWidth - menuWidth / 2 - margin) setMenuPosition('right');
                    else setMenuPosition('center');
                }
            }, [showSubMenu]);

            const activeSubChoice = sticker.hasSubMenu ? sticker.subChoices.find(sub => activeFilters.some(f => f.id === sub.id && !f.excluded)) : null;
            const excludedSubChoice = sticker.hasSubMenu ? sticker.subChoices.find(sub => activeFilters.some(f => f.id === sub.id && f.excluded)) : null;
            
            const isActive = sticker.hasSubMenu ? !!activeSubChoice : activeFilters.some(f => f.id === sticker.id && !f.excluded);
            const isExcluded = sticker.hasSubMenu ? !!excludedSubChoice : activeFilters.some(f => f.id === sticker.id && f.excluded);
            
            const handleSelect = 
                sticker.id === 'genre' ? onGenreSelect : 
                sticker.id === 'langue' ? onLangueSelect :
                sticker.id === 'time' ? onTimeSelect :
                sticker.id === 'speed' ? onSpeedSelect :
                onSubSelect;

            return (
                <div style={{ position: 'relative' }} ref={containerRef}>
                    <div 
                        className={`sticker-filter ${isActive ? 'active' : ''} ${isExcluded ? 'excluded' : ''}`} 
                        onClick={() => sticker.hasSubMenu ? setShowSubMenu(!showSubMenu) : onToggle(sticker.id)}
                        title={isExcluded ? "Clic pour retirer l'exclusion" : isActive ? "Clic pour exclure" : "Clic pour filtrer"}
                    >
                        <span className="sticker-icon">{excludedSubChoice ? excludedSubChoice.icon : activeSubChoice ? activeSubChoice.icon : sticker.icon}</span>
                        <span>{excludedSubChoice ? excludedSubChoice.label : activeSubChoice ? activeSubChoice.label : sticker.label}</span>
                    </div>
                    {sticker.hasSubMenu && showSubMenu && (
                        <div className={`sub-menu align-${menuPosition}`}>
                            {sticker.subChoices.map(sub => {
                                const isSubActive = activeFilters.some(f => f.id === sub.id && !f.excluded);
                                const isSubExcluded = activeFilters.some(f => f.id === sub.id && f.excluded);
                                return (
                                    <div key={sub.id} className={`sub-menu-item ${isSubActive ? 'active' : ''} ${isSubExcluded ? 'excluded' : ''}`}
                                        onClick={(e) => { e.stopPropagation(); handleSelect(sub.id); setShowSubMenu(false); }}>
                                        <span className="sub-icon">{sub.icon}</span>
                                        <span>{sub.label}</span>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function PlaylistSection() {
            const { state, removeFromPlaylist, reorderPlaylist, saveCurrentPlaylist, loadPlaylistToCart, deletePlaylist, playPlaylist, showToast, dispatch } = useMusic();

                const newOrder = [...state.currentPlaylist];
                const draggedItem = newOrder[draggedIndex];
                newOrder.splice(draggedIndex, 1);
                newOrder.splice(index, 0, draggedItem);

        function MusicApp() {
            const { state, dispatch, addTrack, showToast, playPlaylist } = useMusic();
            const [urlInput, setUrlInput] = useState('');
            const fileInputRef = useRef(null);
            const [cloudActive, setCloudActive] = useState(false);
            const [cloudLoading, setCloudLoading] = useState(false);

            const filteredTracks = trierEtFiltrer(state.tracks, { search: state.search, stickerFilter: state.stickerFilter });

            const handleAdd = async () => { if (!urlInput.trim()) return; await addTrack(urlInput); setUrlInput(''); };
            const handleImport = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                try {
                    const { tracks, playlists } = await importFromJson(file);
                    const migratedTracks = migrerTracks(tracks);
                    dispatch({ type: 'SET_TRACKS', payload: migratedTracks.map(t => new Track(t)) });
                    if (playlists.length > 0) dispatch({ type: 'SET_PLAYLISTS', payload: playlists });
                    showToast(`${tracks.length} morceaux importés !`);
                } catch (err) { showToast(err.message, 'error'); }
            };

            // 🔥 EXPORT vers localStorage + Firebase
            const handleExport = async () => {
                // Export local (fichier JSON)
                exportToJson(state.tracks, state.playlists);
                
                // Export vers Firebase
                const success = await saveToFirebase(state.tracks, state.playlists);
                if (success) {
                    showToast("💾 Exporté en local ET sur le Cloud Firebase !", "success");
                } else {
                    showToast("️ Export local réussi, mais échec Cloud", "warning");
                }
            };

            // 🔥 CHARGEMENT depuis Firebase
            const handleCloudClick = async () => {
                if (cloudActive || cloudLoading) return;
                
                setCloudLoading(true);
                showToast("☁️ Chargement depuis Firebase...", "info");
                
                try {
                    const cloudData = await loadFromFirebase();
                    
                    if (cloudData) {
                        const migratedTracks = migrerTracks(cloudData.morceaux || []);
                        const playlists = cloudData.playlists || [];
                        
                        dispatch({ type: 'SET_TRACKS', payload: migratedTracks.map(t => new Track(t)) });
                        dispatch({ type: 'SET_PLAYLISTS', payload: playlists });
                        
                        showToast("✅ Données chargées depuis Firebase !", "success");
                    } else {
                        showToast("ℹ️ Aucune donnée trouvée dans le Cloud", "info");
                    }
                } catch (error) {
                    showToast("❌ Erreur de chargement Cloud", "error");
                    console.error(error);
                } finally {
                    setCloudLoading(false);
                    setCloudActive(true);
                    setTimeout(() => setCloudActive(false), 3000);
                }
            };

            const openModal = (title, content, type = 'default') => dispatch({ type: 'SHOW_MODAL', payload: { title, content, type } });

            const toggleStickerFilter = (stickerId) => {
                const current = state.stickerFilter;
                const existing = current.find(f => f.id === stickerId);
                if (!existing) {
                    dispatch({ type: 'SET_STICKER_FILTER', payload: [...current, { id: stickerId, excluded: false }] });
                } else if (!existing.excluded) {
                    dispatch({ type: 'SET_STICKER_FILTER', payload: [...current.filter(f => f.id !== stickerId), { id: stickerId, excluded: true }] });

                    dispatch({ type: 'SET_STICKER_FILTER', payload: current.filter(f => f.id !== stickerId) });

                                            showToast(state.randomMode ? " Mode Random DÉSACTIVÉ" : "🔀 Mode Random ACTIVÉ", "warning");
                                        }}
                                        title={state.randomMode ? "Désactiver le mode aléatoire" : "Activer le mode aléatoire"}
                                    >
                                        <span className="random-icon">🔀</span>
                                        {state.randomMode ? 'ON' : 'OFF'}
                                    </button>
                                    <button className="btn-play-library" onClick={playLibrary} disabled={filteredTracks.length === 0}>
                                        <span className="play-icon">▶</span> PLAY
                                    </button>
                                </div>
                            </div>
                            <div className="column-content">
                                <div className="track-list">
                                    {filteredTracks.length === 0 ? (
                                        <p className="empty-state">Aucun morceau trouvé. Ajoutez-en un via YouTube !</p>
                                    ) : (
                                        filteredTracks.map(track => <TrackCard key={track.id} track={track} />)
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="column">
                            <PlaylistSection />
                        </div>
                    </div>

                    <Toast />
                    <Modal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <React.StrictMode>
                <MusicProvider>
                    <MusicApp />
                </MusicProvider>
            </React.StrictMode>
        );
    </script>
</body>
</html>
