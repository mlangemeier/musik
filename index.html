    <style>
        :root {
            --bg-primary: #0A0A0C; --bg-secondary: #121216; --bg-card: #1A1A20;
            --bg-hover: #25252D; --text-primary: #F5F5F7; --text-secondary: #A1A1AA;
            --accent: #8B5CF6; --accent-hover: #7C3AED; --success: #10B981;
            --error: #EF4444; --border: #27272A; --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg-primary: #F8FAFC; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
            --bg-hover: #F1F5F9; --text-primary: #0F172A; --text-secondary: #64748B;
            --accent: #7C3AED; --accent-hover: #6D28D9; --border: #E2E8F0; 
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-primary); color: var(--text-primary); 
            font-family: 'Inter', sans-serif; line-height: 1.5; 
            -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease; 
        }
        
        .app-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-header { flex-shrink: 0; margin-bottom: 1.5rem; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .app-header h1 { 
            font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; 
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            display: flex; align-items: center; gap: 1rem;
        }
        
        .version-badge { 
            font-size: 0.9rem; background: var(--accent); color: white; 
            padding: 4px 10px; border-radius: 20px; vertical-align: middle; 
            -webkit-text-fill-color: white; cursor: pointer; 
            transition: transform 0.2s, background 0.2s;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .version-badge:hover { transform: scale(1.05); background: var(--accent-hover); }

        .add-form { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .add-form input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 0.7rem 1rem; border-radius: var(--radius); font-size: 0.95rem; transition: var(--transition); }
        .add-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        
        .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
        .search-box { display: flex; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 1rem; flex: 1; min-width: 200px; }
        .search-box input { background: transparent; border: none; color: var(--text-primary); padding: 0.5rem; width: 100%; outline: none; }
        
        .filter-wrapper { display: flex; align-items: center; gap: 0.5rem; }
        .filter-label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
        
        select, .btn-secondary, .btn-primary { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 0.5rem 0.9rem; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; transition: var(--transition); font-family: inherit; }
        select:hover, .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }
        
        .stickers-bar { 
            display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; 
            padding: 0.6rem; background: var(--bg-secondary); 
            border: 1px solid var(--border); border-radius: var(--radius);
        }
        .stickers-label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-right: 0.5rem; }
        
        .sticker-filter {
            background: var(--bg-card); border: 2px solid var(--border); border-radius: 20px;
            padding: 0.35rem 0.7rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; font-weight: 600;
            color: var(--text-secondary); position: relative;
        }
        .sticker-filter:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
        .sticker-filter.active { background: var(--accent); border-color: var(--accent); color: white; }
        .sticker-filter .sticker-icon { font-size: 0.95rem; }
        
        .sub-menu {
            position: absolute;
            top: calc(100% + 8px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 100;
            min-width: max-content;
            left: 50%;
            transform: translateX(-50%);
        }
        .sub-menu.align-left { left: 0; transform: none; }
        .sub-menu.align-right { left: auto; right: 0; transform: none; }
        
        .sub-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 2px solid transparent;
        }
        .sub-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sub-menu-item.active { background: var(--accent); color: white; border-color: var(--accent-hover); }
        .sub-menu-item .sub-icon { font-size: 1.2rem; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .column-header {
            flex-shrink: 0;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 0.75rem;
        }

        .column-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        .count { color: var(--text-secondary); font-weight: normal; font-size: 1rem; }

        .column-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .column-content::-webkit-scrollbar { width: 8px; }
        .column-content::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 4px; }
        .column-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .column-content::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .playlist-section {
            background: var(--bg-secondary);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .playlist-controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
            align-items: center;
        }

        .playlist-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius);
            font-size: 0.85rem;
            flex: 1;
            min-width: 120px;
        }

        .playlist-input:focus { outline: none; border-color: var(--accent); }

        .btn-play-playlist { 
            background: var(--success); color: white; border: none; 
            padding: 0.5rem 1rem; border-radius: 30px; font-weight: bold; 
            font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: transform 0.2s;
        }
        .btn-play-playlist:hover { transform: scale(1.05); background: #059669; }
        
        .btn-icon-small {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-icon-small:hover { background: var(--bg-hover); color: var(--text-primary); }

        .playlist-items-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 0.75rem;
            padding-right: 0.3rem;
        }

        .playlist-items-container::-webkit-scrollbar { width: 6px; }
        .playlist-items-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .playlist-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
            cursor: move;
            margin-bottom: 0.4rem;
        }
        
        .playlist-item:hover { background: var(--bg-hover); border-color: var(--accent); }
        .playlist-item.dragging { opacity: 0.5; border-color: var(--accent); }
        
        .playlist-item-number {
            background: var(--accent);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .playlist-item-info { flex: 1; min-width: 0; }
        .playlist-item-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-item-artist { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .playlist-empty { text-align: center; color: var(--text-secondary); padding: 2rem 1rem; font-style: italic; font-size: 0.9rem; }

        .saved-playlists { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
        .saved-playlists-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }

        .saved-playlist-item {
            background: var(--bg-card);
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
            border: 1px solid var(--border);
        }

        .saved-playlist-info { flex: 1; min-width: 0; }
        .saved-playlist-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .saved-playlist-count { font-size: 0.75rem; color: var(--text-secondary); }
        .saved-playlist-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
        
        .track-list { display: flex; flex-direction: column; gap: 0.5rem; }
        
        .track-card { 
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); 
            padding: 0.9rem; display: flex; justify-content: space-between; align-items: center; 
            transition: var(--transition); box-shadow: var(--card-shadow);
        }
        .track-card:hover { background: var(--bg-hover); border-color: var(--accent); transform: translateY(-1px); }
        .track-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .track-stickers { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
        .sticker-tag { 
            background: var(--accent); color: white; padding: 1px 6px; border-radius: 10px; 
            font-size: 0.7rem; font-weight: 600; display: inline-flex; align-items: center; gap: 3px;
        }
        .track-actions { display: flex; gap: 0.3rem; opacity: 0.7; transition: var(--transition); flex-shrink: 0; }
        .track-card:hover .track-actions { opacity: 1; }
        
        .btn-icon { background: transparent; border: none; color: var(--text-secondary); padding: 0.4rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: var(--transition); font-size: 1.1rem; }
        .btn-icon:hover { background: rgba(139, 92, 246, 0.1); color: var(--accent); }
        .btn-play:hover { color: var(--success) !important; } .btn-delete:hover { color: var(--error) !important; }
        .btn-add-playlist:hover { color: var(--accent) !important; }
        .active-fav { color: #FBBF24 !important; }
        
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 0.8rem 1.2rem; border-radius: var(--radius); display: flex; align-items: center; gap: 0.6rem; font-weight: 500; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); animation: slideIn 0.3s ease-out forwards; z-index: 1000; font-size: 0.9rem; }
        .toast-success { background: #064E3B; color: #A7F3D0; border: 1px solid #10B981; }
        .toast-error { background: #7F1D1D; color: #FCA5A5; border: 1px solid #EF4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem 0; font-size: 1rem; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); color: var(--text-primary); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .modal-header h3 { font-size: 1.5rem; font-weight: 700; }
        .modal-body { color: var(--text-secondary); white-space: pre-wrap; font-family: 'Inter', monospace; line-height: 1.6; font-size: 0.95rem; }
        .btn-close { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; }
        .btn-close:hover { color: var(--text-primary); }

        .sticker-box { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .sticker-item {
            background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 20px;
            padding: 0.3rem 0.6rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 600;
            color: var(--text-secondary); position: relative;
        }
        .sticker-item:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
        .sticker-item.active { background: var(--accent); border-color: var(--accent); color: white; }
        .sticker-item .sticker-icon { font-size: 0.9rem; }
        
        .btn-toggle-stickers { 
            background: transparent; border: none; color: var(--accent); 
            cursor: pointer; font-size: 0.8rem; margin-top: 0.3rem;
            text-decoration: underline; padding: 0;
        }
        .btn-toggle-stickers:hover { color: var(--accent-hover); }

        @media (max-width: 900px) { 
            .main-content { grid-template-columns: 1fr; }
            .column { min-height: 400px; }
            .track-card { flex-direction: column; align-items: flex-start; gap: 0.75rem; } 
            .track-actions { width: 100%; justify-content: space-around; opacity: 1; } 
            .header-top { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
        }
    </style>
</head>

        const getStickerInfo = (stickerId) => {
            for (const sticker of STICKERS_DISPONIBLES) {
                if (sticker.hasSubMenu) {
                    const sub = sticker.subChoices.find(s => s.id === stickerId);
                    if (sub) return sub;
                }
                if (sticker.id === stickerId) return sticker;
            }
            return null;

        const nettoyerTitre = (titre) => {
            if (!titre) return '';
            let nettoye = titre;
            nettoye = nettoye.replace(/\s*\([^)]*\)/g, '');
            nettoye = nettoye.replace(/\s*\[[^\]]*\]/g, '');
            nettoye = nettoye.trim().replace(/\s+/g, ' ');
            return nettoye;
        };

        class Track {
            constructor(data) {
                this.id = data.id || crypto.randomUUID();
                this.titre = nettoyerTitre(data.titre || '');
                this.artiste = data.artiste || '';
                this.lien = data.lien || ''; 
                this.favori = data.favori || false;
                this.stickers = data.stickers || [];
            }
            toggleFavorite() { return new Track({ ...this, favori: !this.favori }); }
            toggleSticker(stickerId) {
                const hasSticker = this.stickers.includes(stickerId);
                const newStickers = hasSticker ? this.stickers.filter(s => s !== stickerId) : [...this.stickers, stickerId];
                return new Track({ ...this, stickers: newStickers });
            }
            setFormation(formationId) {
                const formations = ['groupe', 'duo', 'single'];
                const cleaned = this.stickers.filter(s => !formations.includes(s));
                if (this.stickers.includes(formationId)) return new Track({ ...this, stickers: cleaned });
                return new Track({ ...this, stickers: [...cleaned, formationId] });
            }
            setGenre(genreId) {
                const genres = ['rock', 'reggae', 'rap', 'pop'];
                const cleaned = this.stickers.filter(s => !genres.includes(s));
                if (this.stickers.includes(genreId)) return new Track({ ...this, stickers: cleaned });
                return new Track({ ...this, stickers: [...cleaned, genreId] });
            }
            setLangue(langueId) {
                const langues = ['eng', 'fr'];
                const cleaned = this.stickers.filter(s => !langues.includes(s));
                if (this.stickers.includes(langueId)) return new Track({ ...this, stickers: cleaned });
                return new Track({ ...this, stickers: [...cleaned, langueId] });
            }
        }

        const normaliser = (texte) => texte.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        const estDoublon = (tracks, nouveau) => tracks.some(t => t.lien === nouveau.lien || normaliser(t.titre) === normaliser(nouveau.titre));

        const trierEtFiltrer = (tracks, { search, filter, stickerFilter }) => {
            let result = [...tracks];
            if (filter === 'favoris') result = result.filter(t => t.favori);
            if (search) { 
                const q = search.toLowerCase(); 
                result = result.filter(t => t.titre.toLowerCase().includes(q) || t.artiste.toLowerCase().includes(q)); 
            }
            if (stickerFilter && stickerFilter.length > 0) {
                result = result.filter(t => stickerFilter.every(sticker => t.stickers.includes(sticker)));
            }
            return result.reverse();

        const API_KEY = "AIzaSyDToXoQ5a9-rRz9dkUre-HP6yJTSjeX-FM"; 
        const extraireVideoId = (url) => { const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/; const match = url.match(regex); return match ? match[1] : null; };
        
        const recupererInfosYoutube = async (url) => {
            const videoId = extraireVideoId(url);
            if (!videoId) throw new Error("Lien YouTube invalide");
            const apiUrl = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&part=snippet&key=${API_KEY}`;
            const response = await fetch(apiUrl);
            const data = await response.json();
            if (!data.items || data.items.length === 0) throw new Error("Vidéo introuvable");
            return { titre: data.items[0].snippet.title, artiste: data.items[0].snippet.channelTitle, lien: url };
        };

        const exportToJson = (tracks, playlists) => {
            const data = { version: "3.0", dateExport: new Date().toISOString(), morceaux: tracks, playlists: playlists };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'musik.json'; a.click();
            URL.revokeObjectURL(url);
        };

        const importFromJson = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const content = JSON.parse(e.target.result);
                    const tracks = Array.isArray(content) ? content : content.morceaux || [];
                    const playlists = content.playlists || [];

        function reducer(state, action) {
            switch (action.type) {
                case 'SET_TRACKS': return { ...state, tracks: action.payload };
                case 'SET_SEARCH': return { ...state, search: action.payload };
                case 'SET_FILTER': return { ...state, filter: action.payload };
                case 'SET_STICKER_FILTER': return { ...state, stickerFilter: action.payload };
                case 'SHOW_TOAST': return { ...state, toast: action.payload };
                case 'HIDE_TOAST': return { ...state, toast: null };
                case 'SHOW_MODAL': return { ...state, modal: action.payload };
                case 'HIDE_MODAL': return { ...state, modal: null };
                case 'TOGGLE_THEME': return { ...state, theme: state.theme === 'dark' ? 'light' : 'dark' };
                case 'SET_PLAYLISTS': return { ...state, playlists: action.payload };
                case 'SET_CURRENT_PLAYLIST': return { ...state, currentPlaylist: action.payload };
                case 'ADD_TO_PLAYLIST': return { ...state, currentPlaylist: [...state.currentPlaylist, action.payload] };
                case 'REMOVE_FROM_PLAYLIST': return { ...state, currentPlaylist: state.currentPlaylist.filter((_, idx) => idx !== action.payload) };
                case 'REORDER_PLAYLIST': return { ...state, currentPlaylist: action.payload };
                default: return state;
            }
        }

        function MusicProvider({ children }) {
            const [state, dispatch] = React.useReducer(reducer, initialState);

            useEffect(() => {
                if (state.theme === 'light') document.body.classList.add('light-mode');

                localStorage.setItem(THEME_KEY, state.theme);

            // 🌟 CHARGEMENT : Utilise les données par défaut si localStorage vide
            useEffect(() => {

                const savedPlaylists = loadPlaylists();
                
                // Si localStorage vide, utilise les données par défaut
                const tracksToLoad = saved.length > 0 ? saved : DEFAULT_TRACKS;
                const playlistsToLoad = savedPlaylists.length > 0 ? savedPlaylists : DEFAULT_PLAYLISTS;
                
                dispatch({ type: 'SET_TRACKS', payload: tracksToLoad.map(t => new Track(t)) });
                dispatch({ type: 'SET_PLAYLISTS', payload: playlistsToLoad });
                
                // Sauvegarde les données par défaut si localStorage était vide
                if (saved.length === 0) {
                    saveTracks(tracksToLoad);

                if (savedPlaylists.length === 0) {
                    savePlaylists(playlistsToLoad);

            useEffect(() => {

            const deleteTrack = (id) => { dispatch({ type: 'SET_TRACKS', payload: state.tracks.filter(t => t.id !== id) }); showToast("🗑️ Supprimé"); };

            const addToPlaylist = (track) => { dispatch({ type: 'ADD_TO_PLAYLIST', payload: track }); showToast("➕ Ajouté au panier"); };

                const newPlaylist = { id: crypto.randomUUID(), name: name || `Playlist ${state.playlists.length + 1}`, tracks: state.currentPlaylist, createdAt: Date.now() };
                dispatch({ type: 'SET_PLAYLISTS', payload: [...state.playlists, newPlaylist] });
                dispatch({ type: 'SET_CURRENT_PLAYLIST', payload: [] });
                showToast(`💾 Playlist "${newPlaylist.name}" sauvegardée !`);
            };

            const duplicatePlaylist = (playlistId) => {
                const playlist = state.playlists.find(p => p.id === playlistId);
                if (!playlist) return;
                dispatch({ type: 'SET_PLAYLISTS', payload: [...state.playlists, { ...playlist, id: crypto.randomUUID(), name: `${playlist.name} (copie)`, createdAt: Date.now() }] });

                                <span className="version-badge" onClick={() => openModal('📜 Historique des Versions', `🎵 MUSIK v3.0\n\n✅ Layout 2 colonnes (Bibliothèque / Panier)\n✅ Système Playlist Panier\n✅ Drag & Drop réorganisation\n✅ Nommer/Dupliquer/Supprimer playlists\n✅ Bouton PLAY intégré\n✅ Stickers GENRE (Rock/Reggae/Rap/Pop)\n✅ Sticker LANGUE (ENG/FR)\n✅ Sticker Formation (Groupe/Duo/Single)\n✅ Sticker Lyrics \n✅ Sticker Delire 🎭\n✅ Bibliothèque pré-chargée\n✅ Filtrage cumulatif (AND)\n✅ Nettoyage automatique des titres\n✅ Mode Clair/Sombre`)}>
                                    v3.0 ℹ️
                                </span>
                            </h1>
                            <button onClick={() => dispatch({ type: 'TOGGLE_THEME' })} className="btn-secondary" title="Changer le thème">
                                {state.theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                        </div>

                        <div className="add-form">
                            <input type="text" placeholder="Coller un lien YouTube..." value={urlInput} onChange={(e) => setUrlInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdd()} />
                            <button onClick={handleAdd} className="btn-primary">➕ Ajouter</button>
                        </div>
                        
                        <div className="toolbar">
                            <div className="search-box">🔍 <input type="text" placeholder="Rechercher..." value={state.search} onChange={(e) => dispatch({ type: 'SET_SEARCH', payload: e.target.value })} /></div>
                            <div className="filter-wrapper">
                                <span className="filter-label">Filtre :</span>
                                <select value={state.filter} onChange={(e) => dispatch({ type: 'SET_FILTER', payload: e.target.value })}>
                                    <option value="toutes">📚 Toutes</option>
                                    <option value="favoris">⭐ Favoris</option>
                                </select>
                            </div>
                            <button onClick={() => exportToJson(state.tracks, state.playlists)} className="btn-secondary" title="Exporter">📥</button>
                            <button onClick={() => fileInputRef.current.click()} className="btn-secondary" title="Importer">📂</button>
                            <input type="file" ref={fileInputRef} accept=".json" onChange={handleImport} hidden />
                        </div>

                        <div className="stickers-bar">
                            <span className="stickers-label">🏷️ Stickers :</span>
                            {STICKERS_DISPONIBLES.map(sticker => (
                                <StickerFilterItem key={sticker.id} sticker={sticker} activeFilters={state.stickerFilter}
                                    onToggle={toggleStickerFilter} 
                                    onSubSelect={selectFormationFilter}
                                    onGenreSelect={selectGenreFilter}
                                    onLangueSelect={selectLangueFilter} />
                            ))}
                        </div>
                    </header>

                    <div className="main-content">
                        <div className="column">
                            <div className="column-header">
                                <h2>{state.filter === 'favoris' ? '⭐ Favoris' : '📚 Bibliothèque'} <span className="count">({filteredTracks.length})</span></h2>
                            </div>
                            <div className="column-content">
                                <div className="track-list">
                                    {filteredTracks.length === 0 ? (
                                        <p className="empty-state">Aucun morceau trouvé. Ajoutez-en un via YouTube !</p>
                                    ) : (
                                        filteredTracks.map(track => <TrackCard key={track.id} track={track} />)
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="column">
                            <PlaylistSection />
                        </div>
                    </div>

                    <Toast />
                    <Modal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <React.StrictMode>
                <MusicProvider>
                    <MusicApp />
                </MusicProvider>
            </React.StrictMode>
        );
    </script>
</body>
</html>
